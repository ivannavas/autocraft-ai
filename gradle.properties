org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Gradle itself has to run on a modern JDK: Loom needs a JVM 21+ just to resolve, and the mod compiles
# against Java 25. The machine-wide JAVA_HOME is a JDK 17, so name the JDK here instead of depending on
# the environment. On another machine, point this at any JDK 25+ (or delete the line if JAVA_HOME is one).
org.gradle.java.home=C:/Users/ivan1/.jdks/openjdk-26.0.1

minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.19

fabric_api_version=0.155.2+26.2

mod_version=1.0.0
maven_group=io.github.ivannavas.autocraftai
archives_base_name=autocraft-ai

# The objective agent's framework, and the JSON library it and we parse the model's answers with. Jackson
# is pinned to the version sprout was built against so the nested jars cannot disagree with each other.
sprout_version=1.9.0
jackson_version=2.22.0
# Jackson's annotations module is versioned on its own track and has no patch release for this line, so
# it cannot share the property above — jackson-databind's own pom asks for exactly this.
jackson_annotations_version=2.22
