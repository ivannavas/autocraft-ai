plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// No loom { } block on purpose. A client-only mod has no server half to split off, so everything lives in
// the single `main` source set and splitEnvironmentSourceSets() would only get in the way. Loom still
// generates a runServer task; the mod declares "environment": "client" and simply is not loaded there.

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // The objective agent. Sprout is the framework the agent is written against; jackson is what it
    // parses the API's answers with, and Minecraft ships neither — so both, and sprout-core underneath,
    // are nested in the mod jar with include(). include() does not follow transitives, which is why every
    // jar that has to be there is named individually below.
    implementation "io.github.ivannavas:sprout-anthropic:${project.sprout_version}"
    include "io.github.ivannavas:sprout-anthropic:${project.sprout_version}"
    include "io.github.ivannavas:sprout-core:${project.sprout_version}"
    include "com.fasterxml.jackson.core:jackson-databind:${project.jackson_version}"
    include "com.fasterxml.jackson.core:jackson-core:${project.jackson_version}"
    include "com.fasterxml.jackson.core:jackson-annotations:${project.jackson_annotations_version}"

    compileOnly "org.projectlombok:lombok:1.18.38"
    annotationProcessor "org.projectlombok:lombok:1.18.38"
    testCompileOnly "org.projectlombok:lombok:1.18.38"
    testAnnotationProcessor "org.projectlombok:lombok:1.18.38"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName"}
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
